# ============================================================
# Java Util Logging Configuration
# Business Management System
# ============================================================

# Root logger handlers
handlers=java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Default logging level
.level=INFO

# Console Handler Configuration
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.ConsoleHandler.encoding=UTF-8

# File Handler Configuration
java.util.logging.FileHandler.level=ALL
java.util.logging.FileHandler.pattern=logs/business-mgmt-%g.log
java.util.logging.FileHandler.limit=5242880
java.util.logging.FileHandler.count=5
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.FileHandler.encoding=UTF-8

# SimpleFormatter format: [date] [level] [class.method] message
java.util.logging.SimpleFormatter.format=%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$-7s [%2$s] %5$s%6$s%n

# Package-level logging
com.businessmgmt.level=FINE
com.businessmgmt.util.DatabaseConnection.level=INFO
